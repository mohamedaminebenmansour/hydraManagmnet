<title>Trésorerie SIGAT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fixed top bar with the scope switch, tabs under it, then one view at a time.
   Detail pages open full width; a line opens in a side drawer with its justification form. */
:root {
  --bg: #f4f6f5; --panel: #ffffff; --panel-2: #eef2f1; --ink: #16212b; --muted: #58656f; --line: #dbe1df;
  --accent: #0d5c6e; --accent-ink: #ffffff; --accent-soft: #e1eff2;
  --ok: #1d7348; --ok-soft: #e3f3ea; --warn: #9a5b00; --warn-soft: #fbf0dc; --bad: #b42318; --bad-soft: #fbe7e5;
  --vio: #5b3fb5; --vio-soft: #eeeafb; --shadow: 0 1px 2px rgba(16,33,43,.06), 0 4px 16px rgba(16,33,43,.06);
  --f-body: "Public Sans", "Segoe UI", Roboto, Arial, sans-serif; --f-num: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1619; --panel: #162126; --panel-2: #1c2a30; --ink: #e5ecee; --muted: #9aabb2; --line: #2a3a41;
  --accent: #5cb7c9; --accent-ink: #062027; --accent-soft: #173640;
  --ok: #5fc58e; --ok-soft: #173426; --warn: #e8a948; --warn-soft: #3a2b12; --bad: #f2867b; --bad-soft: #3e1d1a;
  --vio: #b6a3f2; --vio-soft: #2a2343; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1619; --panel: #162126; --panel-2: #1c2a30; --ink: #e5ecee; --muted: #9aabb2; --line: #2a3a41;
  --accent: #5cb7c9; --accent-ink: #062027; --accent-soft: #173640;
  --ok: #5fc58e; --ok-soft: #173426; --warn: #e8a948; --warn-soft: #3a2b12; --bad: #f2867b; --bad-soft: #3e1d1a;
  --vio: #b6a3f2; --vio-soft: #2a2343; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1400px; margin-inline: auto; }
header.top { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
.topbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 12px 8px; }
.brand { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
.brand b { font-size: 17px; letter-spacing: -.01em; }
.brand small { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel-2); }
.seg button { font: inherit; font-size: 12.5px; border: 0; background: none; color: var(--muted); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { color: var(--muted); text-decoration: none; padding: 9px 12px; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
main { padding-block: 20px 48px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.015em; text-wrap: balance; }
h2 { font-size: 15px; margin: 0; }
h3 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.lead { color: var(--muted); max-width: 80ch; }
.crumb { font-size: 13px; color: var(--muted); }
.crumb a { color: var(--accent); text-decoration: none; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.kpi span { display: block; font-size: 12px; color: var(--muted); }
.kpi b { display: block; font-family: var(--f-num); font-weight: 500; font-size: 21px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-size: 12px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel-2); position: sticky; top: 0; white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--accent-soft); }
tfoot td { font-weight: 600; background: var(--panel-2); border-top: 1px solid var(--line); }
.desc { min-width: 220px; max-width: 460px; }
.desc .sub { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.flag { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.red { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-none { background: var(--panel-2); color: var(--muted); }
.s-justifie, .s-valide { background: var(--ok-soft); color: var(--ok); }
.s-partiel, .s-a-revoir { background: var(--warn-soft); color: var(--warn); }
.s-non-justifie { background: var(--bad-soft); color: var(--bad); }
.s-conteste { background: var(--vio-soft); color: var(--vio); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input, select, textarea { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input[type="search"] { flex: 1 1 220px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { font: inherit; font-size: 13px; font-weight: 600; border-radius: 8px; padding: 7px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 6px; }
.sumbar { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); align-items: baseline; }
.sumbar b { color: var(--ink); font-family: var(--f-num); font-weight: 500; }
.bar { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.acct-card { cursor: pointer; text-align: left; font: inherit; color: inherit; }
.acct-card:hover { border-color: var(--accent); }
.acct-card .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.acct-card .row span { color: var(--muted); }
.badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.split { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.big-solde { font-family: var(--f-num); font-size: 26px; font-weight: 500; }
.note { font-size: 12.5px; color: var(--muted); background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.banner { border-radius: var(--r); padding: 10px 14px; font-size: 13px; background: var(--warn-soft); color: var(--warn); }
.banner.info { background: var(--accent-soft); color: var(--accent); }
.validate { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.validate .seg button { padding: 5px 10px; }
.more { display: flex; justify-content: center; padding: 10px; }
aside.drawer { position: fixed; inset: 0 0 0 auto; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 32px rgba(0,0,0,.15); z-index: 40; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; padding: 16px; border-bottom: 1px solid var(--line); }
.drawer-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.scrim { position: fixed; inset: 0; background: rgba(10,20,25,.35); z-index: 35; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.form { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.form .full { grid-column: 1 / -1; }
.statuses { display: flex; flex-wrap: wrap; gap: 6px; }
.statuses button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.statuses button[aria-pressed="true"] { border-color: currentColor; font-weight: 700; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.loading { padding: 60px 16px; text-align: center; color: var(--muted); }
@media (max-width: 640px) { .form { grid-template-columns: 1fr; } .kpi b { font-size: 18px; } h1 { font-size: 19px; } }
@media (prefers-reduced-motion: no-preference) { aside.drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><b>Trésorerie SIGAT</b><small id="meta">Chargement des données…</small></div>
      <div class="seg" role="group" aria-label="Projets affichés">
        <button type="button" id="scope-grp" aria-pressed="true">Groupement NGNET · 3 projets</button>
        <button type="button" id="scope-all" aria-pressed="false">Tous les projets</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Pages">
      <a href="#accueil" data-tab="accueil">Vue d'ensemble</a>
      <a href="#comptes" data-tab="comptes">Comptes</a>
      <a href="#projets" data-tab="projets">Projets</a>
      <a href="#sous-traitants" data-tab="sous-traitants">Sous-traitants</a>
      <a href="#ngnet" data-tab="ngnet">Réunion NGNET</a>
      <a href="#justificatifs" data-tab="justificatifs">Justificatifs</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view"><div class="loading">Chargement des 8 500 lignes…</div></main>
<div id="drawer-host"></div>

<script>
(() => {
'use strict';
const GRP = ['Hajeb', 'Hammed', 'Ouled Khalfallah'];
const STATUS = [
  ['none', 'Non vérifié'], ['justifie', 'Justifié'], ['partiel', 'Partiel'], ['non-justifie', 'Non justifié'], ['conteste', 'Contesté'],
];
const STATUS_LABEL = Object.fromEntries(STATUS);
const VSTATUS = [['none', 'Pas encore vu'], ['valide', 'Validé avec lui'], ['a-revoir', 'À revoir'], ['conteste', 'Contesté']];
const VLABEL = Object.fromEntries(VSTATUS);
const DOCS = ['Facture', 'Attachement signé', 'Bon de livraison', 'Bon de commande', 'Reçu signé', 'Ordre de virement', 'Relevé bancaire', 'Décompte', 'Autre'];
const FLAGS = {
  'especes': ['Espèces > 5 000 TND', 'Payé en espèces plus de 5 000 TND : amende de 20 % (minimum 2 000 TND) pour celui qui paie.'],
  'hors-compte': ['Absent du compte ST', 'Payé à un sous-traitant mais introuvable dans son compte sous-traitant.'],
  'benefice': ['Avance sur bénéfice', 'Avance sur bénéfice versée à un sous-traitant : à rattacher à son compte et à son contrat.'],
  'doublon': ['Doublon possible', 'Même jour, même montant, même texte et même projet qu\'une autre ligne.'],
  'interne': ['Transfert compté deux fois', 'Transfert entre comptes noté en encaissement et en décaissement.'],
  'date': ['Date impossible', 'La date est dans le futur ou avant 2023 : faute de frappe probable.'],
  'sans-date': ['Sans date', 'La ligne n\'a pas de date.'],
  'non-retrouve': ['Paiement non retrouvé', 'Ce paiement du compte sous-traitant n\'a été retrouvé dans aucune caisse.'],
};
const ACCT_GROUP = { banque: 'Banques', especes: 'Espèces', chantier: 'Caisses chantier', partenaire: 'Caisses partenaires' };

const S = { tables: new Set(), data: null, scope: 'grp', justif: new Map(), valid: new Map(), db: null, user: null, uid: null, canWrite: false, dl: null,
  lineById: new Map(), stById: new Map(), acctById: new Map(), stAcctById: new Map() };

const nf = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
const nf0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
const pf = new Intl.NumberFormat('fr-FR', { style: 'percent', maximumFractionDigits: 0 });
const money = (v) => (v ? nf.format(v) : '');
const money0 = (v) => nf0.format(v || 0);
const dfmt = (s) => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—';
const slug = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.setAttribute('style', v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}
const toast = (msg) => { const t = h('div', { class: 'toast', role: 'status', text: msg }); document.body.append(t); setTimeout(() => t.remove(), 2600); };

/* ---------- data ---------- */
const inScope = (proj) => S.scope === 'all' || GRP.includes(proj);
const jOf = (id) => S.justif.get(id);
const jStatus = (id) => (jOf(id)?.statut) || 'none';
const isTransfer = (l) => l.kind === 'transfert';
const outAmt = (l) => (l.kind === 'partenaire' ? l.d : (isTransfer(l) ? 0 : l.d));
const inAmt = (l) => (l.kind === 'partenaire' ? l.e : (isTransfer(l) ? 0 : l.e));

function stPerson(person) { return S.data.stAccounts.filter((a) => a.person === person); }
function stTotals(sid) {
  let w = 0, p = 0, nf = 0;
  for (const s of S.data.stLines) if (s.st === sid) { w += s.travaux; p += s.paye; if (s.flags.includes('non-retrouve')) nf++; }
  return { travaux: w, paye: p, solde: w - p, nonFound: nf };
}
function sourceOfSt(s) { const l = s.link && S.lineById.get(s.link); return l ? S.acctById.get(l.acct)?.name || 'Sans compte' : null; }

/* ---------- lines table (shared by every page) ---------- */
function linesTable(preset, opts = {}) {
  const st = { q: '', sens: '', mode: '', poste: '', statut: '', flag: '', acct: '', proj: '', party: '', shown: 150, ...(opts.filters || {}) };
  const box = h('div', { class: 'card' });
  const pool = () => S.data.lines.filter((l) => preset(l));
  const all = pool();
  const uniq = (f) => [...new Set(all.map(f).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
  const sel = (key, label, items, fmt = (x) => x) => {
    const s = h('select', { 'aria-label': label }, h('option', { value: '' , text: label }), items.map((x) => h('option', { value: x, text: fmt(x) })));
    s.value = st[key]; s.addEventListener('change', () => { st[key] = s.value; st.shown = 150; draw(); }); return s;
  };
  const search = h('input', { type: 'search', placeholder: 'Chercher : nom, désignation, montant, n° de bon…', 'aria-label': 'Chercher dans les lignes', value: st.q });
  let tmr; search.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(() => { st.q = search.value.trim().toLowerCase(); st.shown = 150; draw(); }, 180); });
  const filters = h('div', { class: 'filters' }, search,
    sel('sens', 'Entrées et sorties', ['in', 'out', 'tr'], (x) => ({ in: 'Entrées seulement', out: 'Sorties seulement', tr: 'Transferts' })[x]),
    opts.hideAcct ? null : sel('acct', 'Tous les comptes', uniq((l) => l.acct), (x) => S.acctById.get(x)?.name || x),
    opts.hideProj ? null : sel('proj', 'Tous les projets', uniq((l) => l.proj)),
    sel('mode', 'Tous les paiements', uniq((l) => l.mode)),
    sel('poste', 'Toutes les catégories', uniq((l) => l.poste)),
    sel('party', 'Tous les sous-traitants', uniq((l) => l.party)),
    sel('statut', 'Tous les justificatifs', STATUS.map((x) => x[0]), (x) => STATUS_LABEL[x]),
    sel('flag', 'Toutes les alertes', ['any', ...Object.keys(FLAGS).filter((k) => k !== 'non-retrouve')], (x) => x === 'any' ? 'Avec une alerte' : FLAGS[x][0]),
    S.dl ? h('button', { class: 'btn', type: 'button', onclick: () => exportCsv(current(), opts.title || 'lignes') }, 'Exporter (Excel)') : null);
  const sum = h('div', { class: 'sumbar' });
  const tw = h('div', { class: 'tw' });
  const more = h('div', { class: 'more' });
  box.append(opts.title ? h('h2', { text: opts.title }) : null, filters, sum, tw, more);

  function current() {
    return pool().filter((l) => {
      if (st.sens === 'in' && !(inAmt(l) > 0)) return false;
      if (st.sens === 'out' && !(outAmt(l) > 0)) return false;
      if (st.sens === 'tr' && !isTransfer(l)) return false;
      if (st.acct && l.acct !== st.acct) return false;
      if (st.proj && l.proj !== st.proj) return false;
      if (st.mode && l.mode !== st.mode) return false;
      if (st.poste && l.poste !== st.poste) return false;
      if (st.party && l.party !== st.party) return false;
      if (st.statut && jStatus(l.id) !== st.statut) return false;
      if (st.flag === 'any' && !l.flags.length) return false;
      if (st.flag && st.flag !== 'any' && !l.flags.includes(st.flag)) return false;
      if (st.q) {
        const j = jOf(l.id);
        const hay = (l.desig + ' ' + l.cat + ' ' + l.party + ' ' + l.poste + ' ' + l.bon + ' ' + l.fct + ' ' + l.sheet + ' ' + l.row + ' ' + money(l.e) + ' ' + money(l.d) + ' ' + (j ? j.ref + ' ' + j.note : '')).toLowerCase();
        if (!hay.includes(st.q) && !hay.replace(/\s/g, '').includes(st.q.replace(/\s/g, ''))) return false;
      }
      return true;
    }).sort(opts.sort || ((a, b) => (b.date || '').localeCompare(a.date || '') || a.row - b.row));
  }
  function draw() {
    const rows = current();
    let e = 0, d = 0, dj = 0;
    for (const l of rows) { e += inAmt(l); d += outAmt(l); const s = jStatus(l.id); if (s === 'justifie') dj += outAmt(l); }
    sum.replaceChildren(
      h('span', null, h('b', { text: rows.length.toLocaleString('fr-FR') }), ' lignes'),
      h('span', null, 'Entrées ', h('b', { class: 'pos', text: nf.format(e) })),
      h('span', null, 'Sorties ', h('b', { class: 'neg', text: nf.format(d) })),
      h('span', null, 'Sorties justifiées ', h('b', { text: d ? pf.format(dj / d) : '—' })));
    if (!rows.length) { tw.replaceChildren(h('div', { class: 'empty', text: 'Aucune ligne ne correspond à ces filtres.' })); more.replaceChildren(); return; }
    const tb = h('tbody');

  document.getElementById('meta').textContent = `Fichier « ${S.data.meta.source} » · converti le ${g.slice(8, 10)}/${g.slice(5, 7)}/${g.slice(0, 4)} · ${S.data.meta.lines.toLocaleString('fr-FR')} lignes de caisse, ${S.data.meta.stLines.toLocaleString('fr-FR')} lignes sous-traitants`;
  route();
  connect();
}
async function connect() {
  if (!window.claude?.use) return;
  const [db, user, dl] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
  S.db = db; S.user = user; S.dl = dl;
  if (user) { try { S.uid = await user.id(); } catch (e) {} }
  if (db) {
    let can = null; try { can = user ? await user.can('data.write') : null; } catch (e) {}
    S.canWrite = can !== false;
    let firstJ = true, firstV = true;
    const onErr = () => {};
    db.collection('justif').onSnapshot((snap) => {
      S.justif = new Map(snap.docs.filter((d) => d.exists).map((d) => [d.id, d.data()]));
      if (firstJ) { firstJ = false; if (!document.querySelector('aside.drawer')) route(true); return; }
      S.tables.forEach((fn) => fn());
    }, onErr);
    db.collection('valid').onSnapshot((snap) => {
      S.valid = new Map(snap.docs.filter((d) => d.exists).map((d) => [d.id, d.data()]));
      if (firstV) { firstV = false; if (!document.querySelector('aside.drawer') && !document.activeElement?.closest('textarea, input')) route(true); }
    }, onErr);
  }
  if (!db) route(true);
}
start();
})();
