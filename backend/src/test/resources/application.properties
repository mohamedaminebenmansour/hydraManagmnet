# Test-context overrides — shadow src/main/resources/application.properties so
# `mvn test` works without exported DB_URL/OWNER_EMAIL env vars.
# Tests run against the dedicated hydra_test database (NOT demo data in hydra).
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/hydra_test
spring.datasource.username=postgres
spring.datasource.password=hydra
spring.jpa.hibernate.ddl-auto=validate
spring.session.jdbc.initialize-schema=always
hydra.storage.type=local
hydra.storage.root=./target/test-files
app.owner.email=owner@hydra.tn
app.owner.password=HydraOwner2026!
logging.level.tn.hydra=INFO
